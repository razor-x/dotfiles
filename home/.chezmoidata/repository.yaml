    groups: [dev]
    url: git@github.com:evansosenko/evansosenko.com.git
  - path: dev/eve-overview
    groups: [dev]
    url: git@github.com:razor-x/eve-overview.git
  - path: dev/landlubber
    groups: [dev]
    url: git@github.com:razor-x/landlubber.git
    remotes:
      - name: makenew
        url: git@github.com:makenew/tsmodule.git
  - path: makenew/benthos-plugin
