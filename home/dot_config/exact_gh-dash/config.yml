keybindings:
  prs:
    - key: O
      name: open in Octo
      command: >
        sh -lc 'repo="$1"; pr="$2";
        if [ -n "${KITTY_WINDOW_ID:-}" ]; then
          exec kitty @ launch --type=tab --cwd "$repo" nvim -c "Octo pr edit $pr";
        fi;
        cd "$repo" && exec nvim -c "Octo pr edit $pr"' sh "{{.RepoPath}}" "{{.PrNumber}}"
