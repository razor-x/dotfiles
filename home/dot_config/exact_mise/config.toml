[settings]
# UPSTREAM: color_theme is not released yet.
# color_theme = '{{ template "theme" (merge (dict "app" "mise") .) }}'

idiomatic_version_file_enable_tools = [
  'bun',
  'dotnet',
  'go',
  'golangci-lint',
  'goreleaser',
  'java',
  'node',
  'npm',
  'opentofu',
  'pnpm',
  'python',
  'ruby',
  'ruff',
  'rust',
  'yarn'
]

ruby.compile=false

[tools."npm:@metabase/cli"]
version = "0"

[tools.doppler]
version = "3"
postinstall = { run = 'sh "${MISE_CONFIG_FILE%/*}/fish-completion.sh" doppler --no-check-version --no-read-env completion fish', when = "always" }
